<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aaditya's Lab Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0b0d12;color:#f4f6fa;font-family:system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:40px 6vw}
header{padding:30px 0 50px}h1{font-size:60px;line-height:.95;margin:10px 0}h1 span{color:#7c9cff}
p{color:#9aa3b2}.bar{display:flex;justify-content:space-between;align-items:center}
button{background:#12151d;border:1px solid #292f3b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:#7c9cff;color:#07101f;border:0;font-weight:700}
.status{padding:12px 15px;border-radius:10px;background:#12151d;border:1px solid #292f3b;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#12151d;border:1px solid #292f3b;border-radius:16px;padding:20px;cursor:pointer}
.card:hover{border-color:#7c9cff}.icon{font-size:30px}.title{font-size:21px;font-weight:800;margin-top:12px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.panel{width:min(560px,100%);background:#12151d;border:1px solid #292f3b;border-radius:18px;padding:24px}
.hidden{display:none}input,textarea,select{width:100%;box-sizing:border-box;background:#191e28;color:#fff;border:1px solid #292f3b;border-radius:10px;padding:10px;margin-top:6px}
label{display:block;margin:12px 0;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="bar"><b>LAB<span style="color:#7c9cff">HUB</span></b><div><button id="editBtn" class="hidden">Edit Lab</button><button id="loginBtn">Sign in</button></div></div>
<div style="margin-top:60px"><small style="color:#7c9cff;letter-spacing:2px;font-weight:800">ENGINEERING LABORATORY</small><h1>Aaditya's<br><span>Lab Hub</span></h1><p>Online experiments, code, screenshots and results.</p></div>
</header>
<div id="status" class="status">Connecting to Supabase…</div>
<div id="subjects" class="grid"></div>
</div>

<div id="auth" class="modal hidden"><div class="panel">
<div class="bar"><h2>Lab Hub Login</h2><button id="closeAuth">×</button></div>
<p>Sign in to edit your lab. Viewing is public.</p>
<label>Email<input id="email" type="email"></label>
<label>Password<input id="password" type="password"></label>
<div><button id="signin" class="primary">Sign in</button> <button id="signup">Create account</button></div>
<div id="authMsg" class="status"></div>
</div></div>

<script>
const SUPABASE_URL="https://mosllsrduvscosldetiy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_6FmY5RVASWUiCYZ0X-czxQ_QRTcWajC";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);

async function checkConnection(){
  const status=$("status");
  const result=await client.from("labs").select("id,name").limit(1);
  if(result.error){
    console.error(result.error);
    status.textContent="Supabase connection error: "+result.error.message;
    status.style.color="#ff8d8d";
    return;
  }
  status.textContent="Online database connected ✓";
  status.style.color="#9cffb0";
  renderLabs(result.data||[]);
}

function renderLabs(labs){
  const box=$("subjects");
  if(!labs.length){
    box.innerHTML='<div class="card"><div class="title">Your lab is ready to be created</div><p>Sign in and click Edit Lab to create it.</p></div>';
    return;
  }
  box.innerHTML=labs.map(l=>`<div class="card"><div class="icon">👤</div><div class="title">${escapeHtml(l.name)}</div><p>Online lab storage is active.</p></div>`).join("");
}

function escapeHtml(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

async function refreshSession(){
  const {data}=await client.auth.getSession();
  if(data.session){
    $("editBtn").classList.remove("hidden");
    $("loginBtn").textContent="Sign out";
    $("loginBtn").onclick=async()=>{await client.auth.signOut();location.reload()};
  }
}

$("loginBtn").onclick=()=>{$("auth").classList.remove("hidden")};
$("closeAuth").onclick=()=>{$("auth").classList.add("hidden")};

$("signin").onclick=async()=>{
  $("authMsg").textContent="Signing in…";
  const r=await client.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(r.error){$("authMsg").textContent="Error: "+r.error.message;return}
  $("authMsg").textContent="Signed in ✓";
  setTimeout(()=>location.reload(),500);
};

$("signup").onclick=async()=>{
  $("authMsg").textContent="Creating account…";
  const r=await client.auth.signUp({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(r.error){$("authMsg").textContent="Error: "+r.error.message;return}
  $("authMsg").textContent="Account created. Check your email if confirmation is enabled.";
};

refreshSession();
checkConnection();
</script>
</body>
</html>
